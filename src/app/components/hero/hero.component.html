<section id="home" class="min-h-[85vh] flex items-center">
  <div class="section-container">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <div>
        <span @fadeAnimation class="inline-block px-4 py-2 rounded-full bg-sky-500/10 text-sky-400 mb-6 mt-24 md:mt-0">
          Hi, I'm
        </span>
        <h1 @slideUpAnimation class="text-7xl lg:text-8xl font-bold mb-6">
          Masego <span class="text-pink-500">Letsapa</span>
        </h1>
        <h2 @fadeAnimation class="section-title text-4xl md:text-5xl font-bold text-white">
          Software <span class="text-sky-400"> Developer </span>
          <br class="md:hidden">
          <span class="text-primary">&</span>
          Business <span class="text-yellow-400"> Analyst </span>
        </h2>
        <p @slideUpAnimation class="text-gray-400 text-xl mb-8">
          Building enterprise software that solves real business problems using Angular, ASP.NET Core and SQL Server.
        </p>
        <div @fadeAnimation class="flex gap-4 mb-6">
          <button class="primary-btn">
            View My Work
          </button>
          <button class="secondary-btn">
            Download CV
          </button>
        </div>
        <div @slideUpAnimation class="flex gap-4 flex-wrap mb-6">
          @for( badge of badges; track badge.title){
          <button class="flex-shrink-1 tech-badge">
            <!-- <svg [lucideIcon]="badge.icon"></svg> -->
            {{ badge.title }}
          </button>
          }
        </div>
        <div @fadeAnimation class="flex gap-8 mt-6">
          <div>
            <h4 class="text-pink-500 text-2xl font-bold">
              <app-counter [end]="8" suffix="+" />
            </h4>
            <p class="text-zinc-400">Modules</p>
          </div>

          <div>
            <h4 class="text-pink-500 text-2xl font-bold">
              <app-counter [end]="20" suffix="+" />
            </h4>
            <p class="text-zinc-400">Features</p>
          </div>

          <div>
            <h4 class="text-pink-500 text-2xl font-bold">
              <app-counter [end]="100" suffix="%" />
            </h4>
            <p class="text-zinc-400">Responsive</p>
          </div>

        </div>
      </div>
      <div @fadeAnimation class="hero-glow profile-ring mt-12">
        <div class="z-50 flex justify-center">
          <div class="z-10 p-2 max-w-96 max-h-96 rounded-full
                    bg-gradient-to-br
                    from-pink-500
                    to-sky-500/50
                    border border-sky-500/20 ">
            <img class="w-full h-full rounded-full" src="/assets/me.webp" alt="Masego Letsapa">
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
